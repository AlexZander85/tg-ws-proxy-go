name: Validate transparent MTProto branch

on:
  push:
    branches:
      - agent/transparent-mtproto-ws

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache: true
          cache-dependency-path: src/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l src/*.go)"
      - name: Unit tests
        run: cd src && go test ./...
      - name: Vet
        run: cd src && go vet ./...
      - name: Build Linux targets
        run: |
          cd src
          for arch in amd64 arm64 arm mips mipsle; do
            echo "building linux/$arch"
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "/tmp/tg-ws-proxy-$arch" .
          done
